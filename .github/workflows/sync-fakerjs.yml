name: Sync faker.js data

# Checks npm for a newer @faker-js/faker, re-imports and recompiles the locale data, runs the tests and opens
# a pull request with the raw JSON diff and data/report.md. If the new data cannot be compiled (for example a
# template calls a faker.js method Phonery doesn't implement yet) it opens an issue instead.
on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'faker.js version to import (default: latest)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Determine versions
        id: versions
        working-directory: tools/extract
        run: |
          current=$(node -p "require('./package.json').dependencies['@faker-js/faker']")
          target="${{ github.event.inputs.version }}"
          if [ -z "$target" ]; then target=$(npm view @faker-js/faker version); fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "faker.js pinned: $current, target: $target"

      - name: Import faker.js ${{ steps.versions.outputs.target }}
        if: steps.versions.outputs.current != steps.versions.outputs.target
        working-directory: tools/extract
        run: |
          npm install --save-exact --ignore-scripts "@faker-js/faker@${{ steps.versions.outputs.target }}"
          node export-locales.mjs ../../data/raw

      - name: Compile locale data
        id: compile
        if: steps.versions.outputs.current != steps.versions.outputs.target
        run: dotnet run --project tools/Phonery.DataCompiler -c Release 2>&1 | tee compile.log

      - name: Test
        if: steps.versions.outputs.current != steps.versions.outputs.target
        run: dotnet test -c Release 2>&1 | tee test.log

      - name: Open pull request
        if: success() && steps.versions.outputs.current != steps.versions.outputs.target
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/faker-js-${{ steps.versions.outputs.target }}
          commit-message: Import locale data from faker.js ${{ steps.versions.outputs.target }}
          title: Import locale data from faker.js ${{ steps.versions.outputs.target }}
          body-path: data/report.md
          add-paths: |
            tools/extract/package.json
            tools/extract/package-lock.json
            data
            src/Phonery/Resources/Locales
            src/Phonery/Data/Generated

      - name: Open issue on failure
        if: failure() && steps.versions.outputs.current != steps.versions.outputs.target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Importing faker.js ${{ steps.versions.outputs.target }} failed. Fix the compiler/runtime and re-run the **Sync faker.js data** workflow."
            echo
            echo '```'
            tail -n 60 compile.log test.log 2>/dev/null || true
            echo '```'
          } > issue.md
          gh issue create --title "faker.js ${{ steps.versions.outputs.target }} import failed" --body-file issue.md
