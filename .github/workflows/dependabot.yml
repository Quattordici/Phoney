version: 2
updates:
  # Keeps SHA-pinned actions current; Dependabot rewrites the SHA and the "# vX" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  # tools/extract holds the pinned faker.js import used by the "Locale data is up to date" check.
  # A bump changes the generated locale data, so review the resulting data diff carefully.
  - package-ecosystem: npm
    directory: /tools/extract
    schedule:
      interval: weekly
