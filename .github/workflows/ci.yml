name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on pull requests only; never cancel main or tag (release) runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon and ubuntu-24.04-arm is Linux on arm64: seeded data must be bit-identical off x64 too, on both of the
        # arm64 runtimes the package ships ReadyToRun code for.
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      # Tests run on net8.0 and net10.0 in CI (see tests/Phoney.Tests/Phoney.Tests.csproj).
      - run: dotnet test -c Release --no-build
      # Containers and AOT apps often run without ICU (InvariantGlobalization): seeded data must be the same there (see Modules/Decomposition.cs).
      - name: Test with invariant globalization
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test -c Release --no-build
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: true
          DOTNET_SYSTEM_GLOBALIZATION_PREDEFINED_CULTURES_ONLY: false # lets tests create named cultures such as sr-Latn-RS

  floors:
    name: Dependency floors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # The packages are built against the lowest versions of xUnit.net, NUnit, MSTest, TUnit, NodaTime, Microsoft.Extensions.DependencyInjection and EF Core they declare (Directory.Packages.props); every other job tests with
      # the newest. Here the test projects run on those lowest versions too, so a newer API creeping in fails this job instead of the users on older versions.
      - name: Build and test the integration packages on their dependency floors
        run: |
          set -euo pipefail
          for framework in Xunit NUnit MSTest TUnit NodaTime DependencyInjection EntityFrameworkCore; do
            dotnet test --project "tests/Phoney.$framework.Tests" -c Release -p:TestAgainstFloors=true
          done
      # Guards the job itself: if the switch stopped working, the tests above would silently run on the newest versions.
      - name: Check that the floors were really used
        run: |
          set -euo pipefail
          check() { # test project, package id, name of the MSBuild property that holds its floor
            floor=$(dotnet msbuild "tests/Phoney.$1.Tests" -getProperty:"$3" -p:TestAgainstFloors=true | tr -d '[:space:]')
            grep -qi "\"$2/$floor\"" "tests/Phoney.$1.Tests/obj/project.assets.json" || { echo "::error::tests/Phoney.$1.Tests did not resolve $2 $floor"; exit 1; }
            echo "$2 $floor"
          }
          check Xunit xunit.v3 XunitFloor
          check Xunit xunit.v3.extensibility.core XunitFloor
          check NUnit NUnit NUnitFloor
          check MSTest MSTest MSTestFloor
          check MSTest MSTest.TestFramework MSTestFloor
          check TUnit TUnit TUnitFloor
          check TUnit TUnit.Core TUnitFloor
          check NodaTime NodaTime NodaTimeFloor
          check DependencyInjection Microsoft.Extensions.DependencyInjection DependencyInjectionFloor
          check DependencyInjection Microsoft.Extensions.DependencyInjection.Abstractions DependencyInjectionFloor
          check EntityFrameworkCore Microsoft.EntityFrameworkCore EfCore8Floor
          check EntityFrameworkCore Microsoft.EntityFrameworkCore EfCore10Floor

  aot:
    name: Native AOT smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Publish with Native AOT (trim/AOT warnings fail the build)
        run: dotnet publish tests/Phoney.AotSmoke -c Release -o artifacts/aot -p:TreatWarningsAsErrors=true
      - run: ./artifacts/aot/Phoney.AotSmoke

  data:
    name: Locale data is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Re-import the pinned faker.js version
        working-directory: tools/extract
        run: |
          npm ci --ignore-scripts
          node export-locales.mjs ../../data/raw
      - run: dotnet run --project tools/Phoney.DataCompiler -c Release
      - name: Fail if committed data differs from a fresh import
        run: git diff --exit-code -- data src/Phoney/Resources src/Phoney/Data/Generated README.md

  # Snyk Open Source (free for public repositories): known vulnerabilities in the NuGet dependencies of the shipped packages. Needs the
  # repository secret SNYK_TOKEN (snyk.io → Account settings → Auth token); without it (forks, or before it is set) the job only says so.
  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The token is only given to the steps that call Snyk, never to restore or build code.
      - name: Check for a token
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -n "$SNYK_TOKEN" ]]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::SNYK_TOKEN is not set, so the Snyk scan was skipped."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: steps.token.outputs.present == 'true'
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # The release binary, checked against its published SHA-256, instead of npx, which would run the npm package's install scripts.
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        if: steps.token.outputs.present == 'true'
        with:
          snyk-version: v1.1307.4
      - if: steps.token.outputs.present == 'true'
        run: dotnet restore
      # Only the packages users install (src/); tests, benchmarks, samples and tools never ship. High and critical issues fail the job.
      - name: Scan the shipped packages
        if: steps.token.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --exclude=tests,benchmarks,samples,tools --severity-threshold=high
      # On main the result is also recorded in the Snyk dashboard, which then reports new vulnerabilities in released dependencies.
      - name: Record the dependencies of main
        if: steps.token.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects --exclude=tests,benchmarks,samples,tools

  # SonarQube Cloud (free for public repositories): bugs, code smells and security hotspots, with pull request decoration. Import the
  # repository at sonarcloud.io, turn its Automatic Analysis off (CI analysis replaces it) and add the secret SONAR_TOKEN; the organization and
  # project keys default to the ones the import creates and can be changed with the repository variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The token is only given to the scanner's begin and end steps, never to the build.
      - name: Check for a token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::SONAR_TOKEN is not set, so the SonarQube Cloud analysis was skipped."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0 # blame information, so new issues are attributed to the change that made them
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: steps.token.outputs.present == 'true'
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install the scanner
        if: steps.token.outputs.present == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 11.3.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Begin the analysis
        if: steps.token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'quattordici' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Quattordici_Phoney' }}
        # Generated and imported files are checked by their own pipeline (the data job), not reviewed by hand.
        run: >-
          dotnet sonarscanner begin /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.exclusions="data/**,src/Phoney/Data/Generated/**,src/Phoney/Resources/**,benchmarks/**,samples/**,tools/**"
          /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/*.xml"
      - name: Build
        if: steps.token.outputs.present == 'true'
        run: dotnet build -c Release
      # Coverage for the quality gate: every test project writes a coverage file (named by a GUID) to TestResults/; test assemblies are left out.
      - name: Test with coverage
        if: steps.token.outputs.present == 'true'
        run: dotnet test -c Release --no-build -- --coverage --coverage-output-format xml
      - name: End the analysis
        if: steps.token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  pack:
    name: Pack
    needs: [build, aot, data]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      # Defence in depth: only tags that point at a commit reachable from main may produce a release.
      - name: Verify release tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main; refusing to pack a release."; exit 1; }
      - name: Pack (version from tag, or a CI pre-release)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; else VERSION="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          # Phoney also carries a ReadyToRun copy per common runtime (Phoney.csproj, PackReadyToRun), so the first call of a process skips most JIT work.
          dotnet pack src/Phoney -c Release -o artifacts/packages -p:Version="$VERSION" -p:PackReadyToRun=true
          for rid in win-x64 linux-x64 linux-arm64 osx-arm64; do for tfm in net8.0 net10.0; do
            unzip -l "artifacts/packages/Phoney.$VERSION.nupkg" | grep -q "runtimes/$rid/lib/$tfm/Phoney.dll" \
              || { echo "::error::The Phoney package has no ReadyToRun assembly for $rid/$tfm."; exit 1; }
          done; done
          dotnet pack src/Phoney.TUnit -c Release -o artifacts/packages -p:Version="$VERSION"
          dotnet pack src/Phoney.Xunit -c Release -o artifacts/packages -p:Version="$VERSION"
          dotnet pack src/Phoney.NUnit -c Release -o artifacts/packages -p:Version="$VERSION"
          dotnet pack src/Phoney.MSTest -c Release -o artifacts/packages -p:Version="$VERSION"
          dotnet pack src/Phoney.DependencyInjection -c Release -o artifacts/packages -p:Version="$VERSION"
          dotnet pack src/Phoney.EntityFrameworkCore -c Release -o artifacts/packages -p:Version="$VERSION"
          dotnet pack src/Phoney.NodaTime -c Release -o artifacts/packages -p:Version="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/packages

  # Trusted publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing): GitHub issues an OIDC
  # token that nuget.org exchanges for a one-hour API key, so no long-lived key is stored. The nuget.org policy
  # must name owner Quattordici, repository Phoney, workflow file ci.yml and environment nuget.
  publish:
    name: Publish to NuGet
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      id-token: write # lets the job request the OIDC token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (OIDC → short-lived API key)
        id: login
        # NuGet/login v1 is an annotated tag: this is the peeled commit SHA, not the tag object SHA.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not the email address
      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
